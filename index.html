<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinergy Dashboard</title>
<link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header id="topbar"></header><main>
<section id="dashboard">
  <div id="kpiGrid" class="kpi-grid"></div>
  <div class="mid-grid">
    <div class="panel">
      <div class="panel-head month-head"><h2>▣ Monthly Performance</h2><div class="month-nav"><button id="prevMonth">‹</button><div id="monthLabel" class="month-label"></div><button id="nextMonth">›</button></div></div>
      <div class="panel-body" id="performance"></div>
    </div>
    <div class="panel">
      <div class="panel-head today-title"><h2>▣ Today's Status</h2><div class="date-chip"><span id="todayDate"></span><b>▣</b></div></div>
      <div class="panel-body"><table class="today-table"><thead><tr><th>Type</th><th class="r">Received</th><th class="c">Completed</th><th class="u">Under Testing</th><th class="s">Buffer Stock</th></tr></thead><tbody id="todayBody"></tbody></table></div>
    </div>
  </div>
  <div class="panel" style="margin-top:14px">
    <div class="panel-head"><h2>♜ Test Bay Monitoring (Live)</h2><div class="legend"><span><i class="av"></i>Available</span><span><i class="oc"></i>Occupied</span><span><i class="tm"></i>Timed Event</span><a class="btn secondary" href="bays.html">View All Bays →</a></div></div>
    <div class="panel-body"><div id="bayGrid" class="bay-grid"></div></div>
  </div>
<div class="panel weekly-panel"><div class="panel-head"><div><h2>Weekly Progress — This Month</h2><small class="muted">Target vs Completed for 3X / 2X / STS</small></div><select id="weekSelect"><option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option><option value="5">Week 5</option></select></div><div class="panel-body"><div id="weeklyGraph" class="weekly-graph"></div></div></div>
</section>
</main><div id="toast"></div><script src="shared.js"></script><script src="dashboard.js"></script></body></html>
