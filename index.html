<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trinergy Testing Tracker</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header><div><b>▲ TRINERGY</b><small> QR TESTING TRACKER · PILOT</small></div><button id="refresh">↻ Refresh</button></header>
<nav><button data-page="dash" class="active">Dashboard</button><button data-page="scan">Scan / Update</button><button data-page="stock">Stock</button></nav>
<main><section id="dash" class="page active"><h2>Current Month KPI</h2><div id="kpis" class="grid3"></div><div class="row"><div class="panel grow"><div class="panelhead"><h3>Monthly Performance</h3><input id="month" type="month"></div><div id="progress"></div></div><div class="panel today"><h3>Today's Status</h3><div id="today"></div></div></div><div class="panel"><h3>Test Bay Monitoring (Live)</h3><div id="bays" class="bays"></div></div></section>
<section id="scan" class="page"><div class="panel form"><h2>QR Scan / Engineer Update</h2><label>QR Code</label><div class="inline"><input id="qr" placeholder="Scan or enter QR"><button id="loadQr">Open</button></div><div id="unitbox"></div></div></section>
<section id="stock" class="page"><div class="panel"><h2>Internal Buffer Stock</h2><div id="stocklist"></div></div></section></main><div id="toast"></div><script src="app.js"></script></body></html>
