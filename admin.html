<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head>
<body><header id="topbar"></header><main>
<div class="page-title"><div><h1>Admin Control Center</h1><div class="muted">Dashboard remains isolated from Admin changes</div></div></div>
<div class="admin-tabs"><button class="admin-tab active" data-pane="targets">Targets</button><button class="admin-tab" data-pane="serials">Serial Numbers</button><button class="admin-tab" data-pane="engineers">Engineers</button><button class="admin-tab" data-pane="timers">Timers</button><button class="admin-tab" data-pane="history">Scan History</button></div>
<div class="panel admin-pane active" id="pane-targets"><div class="panel-head"><h2>Monthly Targets</h2></div><div class="panel-body"><div class="form-grid"><label>Month<input id="targetMonth" type="month"></label><label>3X Target<input id="tg3x" type="number"></label><label>2X Target<input id="tg2x" type="number"></label><label>STS Target<input id="tgsts" type="number"></label></div><br><button id="saveTargets">Save Targets</button></div></div>
<div class="panel admin-pane" id="pane-serials"><div class="panel-head"><h2>Next Serial Counters</h2></div><div class="panel-body"><div class="admin-grid" id="serials"></div></div></div>
<div class="panel admin-pane" id="pane-engineers"><div class="panel-head"><h2>Testing Engineers</h2></div><div class="panel-body"><div class="scan-row"><input id="engName" placeholder="Engineer name"><input id="engId" placeholder="Employee ID"><button id="addEngineer">Add / Reactivate</button></div><table class="table"><thead><tr><th>Name</th><th>Employee ID</th><th>Status</th></tr></thead><tbody id="engineerTable"></tbody></table></div></div>
<div class="panel admin-pane" id="pane-timers"><div class="panel-head"><h2>Heatrun Timers</h2></div><div class="panel-body"><div class="form-grid"><label>Core (sec)<input id="coreTimer" type="number"></label><label>Booster (sec)<input id="boostTimer" type="number"></label><label>STS (sec)<input id="stsTimer" type="number"></label></div><br><button id="saveTimers">Save Timers</button></div></div>
<div class="panel admin-pane" id="pane-history"><div class="panel-head"><h2>QR Scan / Stage History</h2></div><div class="panel-body"><div class="scan-row"><input id="historySearch" placeholder="Serial / QR / Engineer / Stage"><button id="searchHistory">Search</button></div><table class="table"><thead><tr><th>Date/Time</th><th>Serial/QR</th><th>Stage</th><th>Engineer</th><th>Result</th></tr></thead><tbody id="historyBody"></tbody></table></div></div>
</main><div id="toast"></div><script src="shared.js"></script><script src="admin.js"></script></body></html>
