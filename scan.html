<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061827"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Trinergy QR"><link rel="manifest" href="./manifest.webmanifest?v=6147"><link rel="apple-touch-icon" sizes="180x180" href="./trinergy-app-icon-180-v6147.png"><title>Scan / Update</title>
<link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><link rel="icon" type="image/x-icon" href="favicon.ico"></head>
<body><header id="topbar"></header><main>
<div class="page-title"><div><h1>Scan / Update UPS</h1><div class="muted">QR scan or direct live UPS selection</div></div></div>
<div class="panel"><div class="scan-hero"><div><span class="muted">ENGINEER TEST CONTROL</span><h2>Open UPS</h2><p>Only active engineers can perform test actions.</p></div>
<div class="scan-controls"><div class="scan-row"><input id="qr" placeholder="Scan / enter QR"><button id="loadQr">OPEN QR</button></div>
<div class="scan-row"><select id="liveUps"><option>Select Live UPS...</option></select><button id="openLive">OPEN SELECTED UPS</button></div></div></div></div>
<div id="unitbox"></div>
</main><div id="toast"></div><script src="shared.js"></script>
<script>
(function(){
  const SESSION_KEY='tqr_authorized_engineer';
  const SESSION_HOURS=12;
  let scanScriptLoaded=false;

  function statusBox(msg){
    const s=document.getElementById('scanAuthStatus');
    if(!s) return;
    s.textContent=msg;
    s.classList.add('show');
  }
  function clearStatus(){
    const s=document.getElementById('scanAuthStatus');
    if(s){s.textContent='';s.classList.remove('show');}
  }
  function normalized(v){ return String(v||'').trim().toLowerCase(); }
  function getStored(){
    try{
      const x=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if(!x) return null;
      const age=Date.now()-Number(x.ts||0);
      if(age>SESSION_HOURS*60*60*1000) return null;
      return x;
    }catch{return null}
  }
  function saveStored(row){
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ts:Date.now(), name:row.name||row.engineer_name||'', employee_id:row.employee_id||row.emp_id||row.code||''})); }catch{}
  }
  function clearStored(){ try{localStorage.removeItem(SESSION_KEY)}catch{} }
  async function fetchEngineers(){
    const r=await sb.from('tqr_engineers').select('*').limit(500);
    if(r.error) throw r.error;
    return (r.data||[]).filter(x=>{
      if(x.active===false) return false;
      if(x.is_active===false) return false;
      if(String(x.status||'').toUpperCase()==='INACTIVE') return false;
      return true;
    });
  }
  function engineerLabel(x){ return x.name||x.engineer_name||x.full_name||x.employee_id||x.emp_id||'Engineer'; }
  function engineerId(x){ return String(x.employee_id||x.emp_id||x.code||x.id||'').trim(); }
  async function validateStoredSession(){
    const s=getStored();
    if(!s) return null;
    try{
      const engineers=await fetchEngineers();
      return engineers.find(x=>normalized(engineerId(x))===normalized(s.employee_id)) || null;
    }catch{return null}
  }
  function mountGate(){
    document.body.classList.add('scan-auth-locked');
    const main=document.querySelector('main');
    if(!main) return;
    const gate=document.createElement('div');
    gate.className='scan-auth-gate';
    gate.id='scanAuthGate';
    gate.innerHTML=`<div class="scan-auth-card">
      <div class="scan-auth-head">
        <div><div class="eyebrow">AUTHORIZED PERSONNEL ONLY</div><h2>Engineer Access Required</h2></div>
        <div class="scan-auth-badge">LOCKED</div>
      </div>
      <div class="scan-auth-body">
        <div class="scan-auth-note"><b>Only registered engineers can scan QR and update stages.</b><br>If this page was opened using a copied link or by an unauthorized person, access will remain blocked.</div>
        <div class="scan-auth-grid">
          <div><label>Engineer Name</label><select id="authEngineer"><option value="">Loading engineers…</option></select></div>
          <div><label>Employee ID</label><input id="authEmpId" placeholder="Enter registered Employee ID"></div>
        </div>
        <div class="scan-auth-actions">
          <button id="authUnlockBtn">Unlock Scan / Update</button>
          <button id="authRefreshBtn" class="secondary">Refresh Engineer List</button>
        </div>
        <div id="scanAuthStatus" class="scan-auth-status"></div>
      </div>
    </div>`;
    main.prepend(gate);
  }
  async function populateEngineers(){
    const dd=document.getElementById('authEngineer');
    if(!dd) return [];
    dd.innerHTML='<option value="">Loading engineers…</option>';
    const engineers=await fetchEngineers();
    dd.innerHTML='<option value="">Select registered engineer…</option>' + engineers.map((x,i)=>`<option value="${i}">${engineerLabel(x)}${engineerId(x)?` — ${engineerId(x)}`:''}</option>`).join('');
    dd._rows=engineers;
    return engineers;
  }
  function showAuthorizedBanner(row){
    const main=document.querySelector('main');
    if(!main) return;
    const b=document.createElement('div');
    b.className='scan-auth-ok';
    b.id='scanAuthOk';
    b.innerHTML=`<div><b>Authorized engineer:</b> ${engineerLabel(row)}${engineerId(row)?` — ${engineerId(row)}`:''}</div><button type="button" id="authLogoutBtn" class="secondary">Lock Page</button>`;
    main.prepend(b);
    b.querySelector('#authLogoutBtn').onclick=()=>{clearStored(); location.reload();};
  }
  function loadScanScript(){
    if(scanScriptLoaded) return;
    scanScriptLoaded=true;
    const s=document.createElement('script');
    s.src='scan.js';
    document.body.appendChild(s);
  }
  function unlock(row){
    document.body.classList.remove('scan-auth-locked');
    document.getElementById('scanAuthGate')?.remove();
    showAuthorizedBanner(row);
    saveStored(row);
    loadScanScript();
    showToast('Authorized engineer access granted');
  }
  async function tryUnlock(){
    clearStatus();
    const dd=document.getElementById('authEngineer');
    const emp=document.getElementById('authEmpId');
    const rows=dd?dd._rows||[]:[];
    if(!dd || dd.value===''){ statusBox('Select registered engineer first'); return; }
    const row=rows[Number(dd.value)];
    if(!row){ statusBox('Engineer record not found'); return; }
    const entered=normalized(emp?.value);
    const actual=normalized(engineerId(row));
    if(!entered || entered!==actual){ statusBox('Authorized personnel only — employee ID does not match'); showToast('Authorized personnel only'); return; }
    unlock(row);
  }
  async function init(){
    mountScanHeader();
    mountGate();
    document.getElementById('authUnlockBtn')?.addEventListener('click', tryUnlock);
    document.getElementById('authRefreshBtn')?.addEventListener('click', async ()=>{try{await populateEngineers(); showToast('Engineer list refreshed')}catch(e){statusBox('Unable to load engineer list')}});
    try{
      const row=await validateStoredSession();
      if(row){ unlock(row); return; }
    }catch{}
    try{ await populateEngineers(); }catch(e){ statusBox('Unable to load registered engineer list. Check connection and try again.'); }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script></body></html>
